# Build AND auto-release Capsuleers.Intel on every push/merge to `main`.
#
# Each push to main builds the Linux AppImage + Windows NSIS installer on their
# native runners and publishes them to a GitHub Release that electron-updater
# consumes. To get a distinct, monotonically-increasing version per release
# (required for auto-update) WITHOUT committing a version bump back to the repo
# (which would re-trigger the workflow), the release version is computed at build
# time as <major>.<minor>.<github run number> from desktop/package.json.
#
# No native modules (no node-llama-cpp) and no GPU variants, so it's one runner per OS.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # electron-builder creates/updates the Release + its tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            args: --linux
          - os: windows-latest
            label: windows
            args: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # Compute the release version: keep the package.json major.minor, use the
      # workflow run number as the patch. Every matrix job in the same run gets the
      # SAME value, so both OSes publish to one release. Not committed (no loop).
      - name: Set release version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          ver="$(echo "$base" | cut -d. -f1,2).${{ github.run_number }}"
          npm version --no-git-tag-version --allow-same-version "$ver"
          echo "Releasing v$ver"

      # Build the installer and publish it to the GitHub Release for this version.
      # owner/repo come from electron-builder.yml (publish:). The release tag
      # (v<version>) is created automatically against this commit on main.
      - name: Build & publish
        run: npx --no-install electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Backup copy of the installers on the workflow run itself.
      - uses: actions/upload-artifact@v4
        with:
          name: capsuleers-intel-${{ matrix.label }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/latest*.yml
          if-no-files-found: ignore
